<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relationship Guidance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff5f7, #f7f0ff);
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #8e44ad;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .header p {
      color: #666;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: vertical;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #8e44ad;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #8e44ad;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #732d91;
    }

    button:disabled {
      background: #bbb;
      cursor: not-allowed;
    }

    .response {
      margin-top: 25px;
      padding: 20px;
      background: #faf7ff;
      border-left: 4px solid #8e44ad;
      border-radius: 10px;
      display: none;
      line-height: 1.6;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #8e44ad;
      font-weight: bold;
    }

    .error {
      color: #c0392b;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>❤️ Relationship Guidance</h1>
      <p>A safe space to understand your relationship better.</p>
    </div>

    <div class="card">

      <label for="question">
        What's happening in your relationship?
      </label>

      <textarea
        id="question"
        placeholder="Tell us what you're experiencing..."
      ></textarea>

      <button id="askButton" onclick="getGuidance()">
        Get Guidance
      </button>

      <div id="loading" class="loading">
        Thinking about your situation...
      </div>

      <div id="response" class="response"></div>

    </div>

    <div class="footer">
      Relationship Guidance • Your thoughts matter.
    </div>

  </div>

  <script>

    const API_URL =
      "https://relationship-guidance-api.leadrize.workers.dev/";

    async function getGuidance() {

      const question =
        document.getElementById("question").value.trim();

      const responseBox =
        document.getElementById("response");

      const loading =
        document.getElementById("loading");

      const button =
        document.getElementById("askButton");

      if (!question) {
        responseBox.style.display = "block";
        responseBox.innerHTML =
          "<div class='error'>Please tell us what's happening first.</div>";
        return;
      }

      responseBox.style.display = "none";
      loading.style.display = "block";
      button.disabled = true;

      try {

        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        loading.style.display = "none";
        button.disabled = false;

        responseBox.style.display = "block";

        if (!response.ok) {
          throw new Error(
            data.message || "Something went wrong."
          );
        }

        responseBox.innerHTML =
          `<strong>Guidance</strong><br><br>
           ${data.response || data.message || JSON.stringify(data)}`;

      } catch (error) {

        loading.style.display = "none";
        button.disabled = false;

        responseBox.style.display = "block";

        responseBox.innerHTML =
          `<div class="error">
            Unable to connect to the guidance service right now.
            <br><br>
            Please try again in a moment.
          </div>`;

        console.error(error);
      }
    }

  </script>

</body>
</html>
