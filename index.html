<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relationship Guidance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin-bottom: 10px;
      color: #7b3f61;
      font-size: 32px;
    }

    .header p {
      color: #666;
      font-size: 16px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #7b3f61;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #7b3f61;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .response {
      margin-top: 25px;
      padding: 20px;
      background: #faf7f9;
      border-left: 4px solid #7b3f61;
      border-radius: 8px;
      display: none;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #7b3f61;
    }

    .error {
      color: #b00020;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Relationship Guidance</h1>
      <p>A safe space to reflect, understand and move forward.</p>
    </div>

    <div class="card">

      <label for="question">
        What would you like guidance about?
      </label>

      <textarea
        id="question"
        placeholder="Tell us what's happening in your relationship..."
      ></textarea>

      <button id="guidanceButton" onclick="getGuidance()">
        Get Guidance
      </button>

      <div id="loading" class="loading">
        Thinking about your situation...
      </div>

      <div id="response" class="response"></div>

    </div>

    <div class="footer">
      Relationship Guidance • Your conversations deserve care and respect.
    </div>

  </div>

  <script>

    const API_URL =
      "https://relationship-guidance-api.leadrize.workers.dev/";

    async function getGuidance() {

      const question =
        document.getElementById("question").value.trim();

      const responseBox =
        document.getElementById("response");

      const loading =
        document.getElementById("loading");

      const button =
        document.getElementById("guidanceButton");

      if (!question) {
        responseBox.style.display = "block";
        responseBox.className = "response error";
        responseBox.textContent =
          "Please tell us a little about your situation first.";
        return;
      }

      button.disabled = true;
      loading.style.display = "block";
      responseBox.style.display = "none";

      try {

        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })
        });

        if (!response.ok) {
          throw new Error(
            "API returned status " + response.status
          );
        }

        const data = await response.json();

        responseBox.className = "response";
        responseBox.style.display = "block";

        responseBox.textContent =
          data.response ||
          data.message ||
          "Guidance received successfully.";

      } catch (error) {

        console.error(error);

        responseBox.style.display = "block";
        responseBox.className = "response error";

        responseBox.textContent =
          "We couldn't connect to the guidance service right now. Please try again.";

      } finally {

        button.disabled = false;
        loading.style.display = "none";

      }
    }

  </script>

</body>
</html>
