<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Relationship Guidance</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--tg-theme-bg-color, #f7f7f8);
      color: var(--tg-theme-text-color, #222);
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 22px 18px 40px;
    }

    .header {
      text-align: center;
      padding: 15px 5px 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 22px;
      background: linear-gradient(135deg, #ff6b81, #ff8fa3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 8px 25px rgba(255, 107, 129, 0.25);
    }

    h1 {
      margin-top: 15px;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 7px;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 10px 0 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border: none;
      border-radius: 18px;
      padding: 18px 12px;
      min-height: 120px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      transition: transform .15s;
    }

    .card:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 30px;
      margin-bottom: 9px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
    }

    .card-text {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .question-box {
      margin-top: 22px;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      background: var(--tg-theme-bg-color, #f7f7f8);
      color: var(--tg-theme-text-color, #222);
      outline: none;
    }

    .ask-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 13px;
      background: #ff6b81;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }

    .hidden {
      display: none;
    }

    .response {
      margin-top: 15px;
      padding: 15px;
      background: #fff5f6;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">❤️</div>

    <h1>Relationship Guidance</h1>

    <p class="subtitle">
      A safe space to understand your relationships,
      emotions and communication.
    </p>
  </div>

  <div class="section-title">
    What are you going through?
  </div>

  <div class="cards">

    <button class="card" onclick="selectTopic('Communication')">
      <div class="icon">💬</div>
      <div class="card-title">Communication</div>
      <div class="card-text">We keep misunderstanding each other</div>
    </button>

    <button class="card" onclick="selectTopic('Conflict')">
      <div class="icon">⚡</div>
      <div class="card-title">Conflict</div>
      <div class="card-text">We keep fighting</div>
    </button>

    <button class="card" onclick="selectTopic('Trust')">
      <div class="icon">🤝</div>
      <div class="card-title">Trust</div>
      <div class="card-text">Something feels broken</div>
    </button>

    <button class="card" onclick="selectTopic('Breakup')">
      <div class="icon">💔</div>
      <div class="card-title">Breakup</div>
      <div class="card-text">I don't know what to do</div>
    </button>

    <button class="card" onclick="selectTopic('Marriage')">
      <div class="icon">💍</div>
      <div class="card-title">Marriage</div>
      <div class="card-text">We need clarity</div>
    </button>

    <button class="card" onclick="selectTopic('Self')">
      <div class="icon">🧠</div>
      <div class="card-title">Myself</div>
      <div class="card-text">I want to understand myself</div>
    </button>

  </div>

  <div class="question-box">

    <div class="section-title">
      Ask your question
    </div>

    <textarea
      id="question"
      placeholder="Tell me what's happening..."
    ></textarea>

    <button class="ask-button" onclick="askGuidance()">
      Get Guidance
    </button>

    <div id="response" class="response hidden"></div>

  </div>

  <div class="footer">
    Relationship Guidance • Understand better. Communicate better. ❤️
  </div>

</div>

<script>

  // Initialize Telegram Mini App
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  let selectedTopic = "";

  function selectTopic(topic) {

    selectedTopic = topic;

    const textarea = document.getElementById("question");

    textarea.placeholder =
      "Tell me what is happening with your " +
      topic.toLowerCase() +
      " situation...";

    textarea.focus();
  }

  function askGuidance() {

    const question =
      document.getElementById("question").value.trim();

    const response =
      document.getElementById("response");

    if (!question) {

      response.classList.remove("hidden");

      response.innerHTML =
        "Please tell me a little about what you're experiencing. ❤️";

      return;
    }

    response.classList.remove("hidden");

    response.innerHTML =
      "<strong>Thank you for sharing.</strong><br><br>" +
      "Your situation deserves to be understood before making a decision. " +
      "Let's look at what you're feeling, what may be causing the pattern, " +
      "and what your next step could be.";

  }

</script>

</body>
</html>
