<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Relationship Guidance — Coach Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: #f5f7fb;
      color: #202124;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .brand span {
      color: #7c3aed;
    }

    .logout {
      display: none;
      border: 1px solid #ddd;
      background: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .login {
      max-width: 420px;
      margin: 90px auto;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .login h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .login p {
      color: #6b7280;
      line-height: 1.5;
    }

    .login input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin: 12px 0;
    }

    .primary {
      width: 100%;
      border: 0;
      background: #7c3aed;
      color: white;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary:hover {
      opacity: 0.92;
    }

    .error {
      color: #dc2626;
      margin-top: 12px;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      height: calc(100vh - 65px);
    }

    .sidebar {
      width: 360px;
      background: white;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh {
      border: 1px solid #ddd;
      background: white;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    .conversation {
      padding: 17px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .conversation:hover {
      background: #f9fafb;
    }

    .conversation.active {
      background: #f3e8ff;
    }

    .conversation-category {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .conversation-email {
      font-size: 12px;
      color: #6b7280;
    }

    .conversation-message {
      font-size: 13px;
      color: #4b5563;
      margin-top: 8px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-meta {
      margin-top: 9px;
      font-size: 11px;
      color: #6b7280;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 22px;
    }

    .chat-title {
      font-size: 18px;
      font-weight: 700;
    }

    .chat-info {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      text-align: center;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.customer {
      justify-content: flex-start;
    }

    .message-row.coach {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .customer .bubble {
      background: white;
      border: 1px solid #e5e7eb;
    }

    .coach .bubble {
      background: #7c3aed;
      color: white;
    }

    .sender {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
      opacity: 0.7;
    }

    .composer {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 15px;
      display: flex;
      gap: 10px;
    }

    .composer textarea {
      flex: 1;
      min-height: 55px;
      max-height: 150px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
    }

    .send {
      align-self: flex-end;
      border: 0;
      background: #7c3aed;
      color: white;
      padding: 12px 20px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      background: #ede9fe;
      color: #6d28d9;
    }

    .paid {
      background: #dcfce7;
      color: #166534;
    }

    @media (max-width: 800px) {

      .dashboard {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 240px;
      }

      .chat {
        height: calc(100vh - 305px);
      }

      .bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="brand">
      Relationship <span>Guidance</span>
      — Coach
    </div>

    <button
      class="logout"
      id="logoutButton"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <!-- LOGIN -->

  <div
    class="login"
    id="loginScreen"
  >

    <h1>Coach Login</h1>

    <p>
      This is the private Relationship Guidance
      coaching dashboard.
    </p>

    <input
      type="password"
      id="secretInput"
      placeholder="Enter coach secret"
      autocomplete="off"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Enter Dashboard
    </button>

    <div
      class="error"
      id="loginError"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div
    class="dashboard"
    id="dashboard"
  >

    <aside class="sidebar">

      <div class="sidebar-header">

        <strong>
          Conversations
        </strong>

        <button
          class="refresh"
          onclick="loadConversations()"
        >
          ↻ Refresh
        </button>

      </div>

      <div id="conversationList"></div>

    </aside>


    <main class="chat">

      <div
        class="chat-header"
        id="chatHeader"
      >

        <div class="chat-title">
          Select a conversation
        </div>

        <div class="chat-info">
          Choose a customer from the left.
        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >

        <div class="empty">
          Select a conversation to begin.
        </div>

      </div>


      <div class="composer">

        <textarea
          id="replyInput"
          placeholder="Write your reply..."
          disabled
        ></textarea>

        <button
          class="send"
          id="sendButton"
          onclick="sendReply()"
          disabled
        >
          Send
        </button>

      </div>

    </main>

  </div>


  <script>

    const API_URL =
      "https://relationship-guidance-api.leadrize.workers.dev";


    let coachSecret = "";

    let selectedSessionId = "";

    let selectedConversation = null;


    /*
    ============================================================
    LOGIN
    ============================================================
    */

    async function login() {

      const input =
        document.getElementById(
          "secretInput"
        );

      const secret =
        input.value.trim();

      const error =
        document.getElementById(
          "loginError"
        );

      error.textContent = "";


      if (!secret) {

        error.textContent =
          "Please enter your coach secret.";

        return;
      }


      /*
      Test authentication by requesting
      the conversation list.
      */

      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action:
                "coach_list",

              coachSecret:
                secret

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Invalid coach secret."
          );
        }


        coachSecret =
          secret;


        sessionStorage.setItem(
          "coachSecret",
          secret
        );


        document.getElementById(
          "loginScreen"
        ).style.display = "none";


        document.getElementById(
          "dashboard"
        ).style.display = "flex";


        document.getElementById(
          "logoutButton"
        ).style.display = "block";


        renderConversations(
          data.conversations || []
        );

      }

      catch (error) {

        console.error(error);

        error =
          document.getElementById(
            "loginError"
          );

        error.textContent =
          "Login failed. Check your coach secret.";

      }

    }


    /*
    ============================================================
    LOGOUT
    ============================================================
    */

    function logout() {

      coachSecret = "";

      selectedSessionId = "";

      selectedConversation = null;

      sessionStorage.removeItem(
        "coachSecret"
      );

      document.getElementById(
        "dashboard"
      ).style.display = "none";

      document.getElementById(
        "loginScreen"
      ).style.display = "block";

      document.getElementById(
        "logoutButton"
      ).style.display = "none";

      document.getElementById(
        "secretInput"
      ).value = "";

    }


    /*
    ============================================================
    LOAD CONVERSATIONS
    ============================================================
    */

    async function loadConversations() {

      if (!coachSecret) return;


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action:
                "coach_list",

              coachSecret:
                coachSecret

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load conversations."
          );
        }


        renderConversations(
          data.conversations || []
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to load conversations."
        );

      }

    }


    /*
    ============================================================
    RENDER CONVERSATION LIST
    ============================================================
    */

    function renderConversations(
      conversations
    ) {

      const list =
        document.getElementById(
          "conversationList"
        );


      if (!conversations.length) {

        list.innerHTML = `
          <div style="
            padding:25px;
            color:#9ca3af;
            text-align:center;
          ">
            No conversations yet.
          </div>
        `;

        return;
      }


      list.innerHTML =
        conversations
          .map(function(conversation) {

            const active =
              conversation.id ===
              selectedSessionId
                ? "active"
                : "";


            const paid =
              Number(
                conversation.paid
              ) === 1;


            const messageCount =
              Number(
                conversation.free_messages_used ||
                0
              );


            return `

              <div
                class="conversation ${active}"
                onclick="openConversation('${escapeAttribute(conversation.id)}')"
              >

                <div class="conversation-category">

                  ${escapeHtml(
                    conversation.category ||
                    "General"
                  )}

                  <span
                    class="badge ${
                      paid ? "paid" : ""
                    }"
                  >
                    ${
                      paid
                        ? "PAID"
                        : messageCount + "/3 FREE"
                    }
                  </span>

                </div>


                <div class="conversation-email">

                  ${escapeHtml(
                    conversation.customer_email ||
                    "No email provided"
                  )}

                </div>


                <div class="conversation-message">

                  ${escapeHtml(
                    conversation.latest_message ||
                    "No messages"
                  )}

                </div>


                <div class="conversation-meta">

                  ID:
                  ${escapeHtml(
                    conversation.id
                  )}

                </div>

              </div>

            `;

          })
          .join("");

    }


    /*
    ============================================================
    OPEN CONVERSATION
    ============================================================
    */

    async function openConversation(
      sessionId
    ) {

      selectedSessionId =
        sessionId;


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action:
                "coach_messages",

              coachSecret:
                coachSecret,

              sessionId:
                sessionId

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load conversation."
          );
        }


        selectedConversation =
          data.conversation;


        renderConversation(
          data.conversation,
          data.messages || []
        );


        renderConversationsFromRefresh();

      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to open conversation."
        );

      }

    }


    /*
    ============================================================
    RENDER CURRENT CONVERSATION
    ============================================================
    */

    function renderConversation(
      conversation,
      messages
    ) {

      const header =
        document.getElementById(
          "chatHeader"
        );


      const paid =
        Number(
          conversation.paid
        ) === 1;


      header.innerHTML = `

        <div class="chat-title">

          ${escapeHtml(
            conversation.category ||
            "General"
          )}

          <span
            class="badge ${
              paid ? "paid" : ""
            }"
          >
            ${
              paid
                ? "PAID"
                : conversation.free_messages_used +
                  "/3 FREE"
            }
          </span>

        </div>

        <div class="chat-info">

          Customer:
          ${escapeHtml(
            conversation.customer_email ||
            "No email provided"
          )}

          &nbsp; • &nbsp;

          Session:
          ${escapeHtml(
            conversation.id
          )}

        </div>

      `;


      const container =
        document.getElementById(
          "messages"
        );


      if (!messages.length) {

        container.innerHTML = `
          <div class="empty">
            No messages yet.
          </div>
        `;

      }

      else {

        container.innerHTML =
          messages
            .map(function(message) {

              const sender =
                message.sender ===
                "coach"
                  ? "coach"
                  : "customer";


              return `

                <div
                  class="message-row ${sender}"
                >

                  <div class="bubble">

                    <div class="sender">

                      ${
                        sender === "coach"
                          ? "YOU"
                          : "CUSTOMER"
                      }

                    </div>

                    ${escapeHtml(
                      message.message
                    )}

                  </div>

                </div>

              `;

            })
            .join("");

      }


      container.scrollTop =
        container.scrollHeight;


      document.getElementById(
        "replyInput"
      ).disabled = false;


      document.getElementById(
        "sendButton"
      ).disabled = false;

    }


    /*
    ============================================================
    REFRESH SIDEBAR
    ============================================================
    */

    async function renderConversationsFromRefresh() {

      await loadConversations();

    }


    /*
    ============================================================
    SEND COACH REPLY
    ============================================================
    */

    async function sendReply() {

      if (!selectedSessionId) {

        alert(
          "Select a conversation first."
        );

        return;
      }


      const input =
        document.getElementById(
          "replyInput"
        );


      const text =
        input.value.trim();


      if (!text) return;


      const button =
        document.getElementById(
          "sendButton"
        );


      button.disabled = true;

      button.textContent =
        "Sending...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action:
                "coach_reply",

              coachSecret:
                coachSecret,

              sessionId:
                selectedSessionId,

              message:
                text

            })

          });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to send reply."
          );

        }


        input.value = "";


        /*
        Reload the conversation so the
        saved reply appears exactly as
        it exists in D1.
        */

        await openConversation(
          selectedSessionId
        );

      }

      catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Unable to send reply."
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "Send";

      }

    }


    /*
    ============================================================
    SECURITY / DISPLAY HELPERS
    ============================================================
    */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

    }


    /*
    ============================================================
    AUTO LOGIN FROM SESSION
    ============================================================
    */

    window.addEventListener(
      "DOMContentLoaded",
      function() {

        const savedSecret =
          sessionStorage.getItem(
            "coachSecret"
          );


        if (savedSecret) {

          document.getElementById(
            "secretInput"
          ).value =
            savedSecret;

          login();

        }

      }
    );


    /*
    Enter key on login.
    */

    document
      .getElementById("secretInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        }
      );


    /*
    Ctrl + Enter sends a reply.
    */

    document
      .getElementById("replyInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.ctrlKey &&
            event.key === "Enter"
          ) {

            event.preventDefault();

            sendReply();

          }

        }
      );

  </script>

</body>
</html>
